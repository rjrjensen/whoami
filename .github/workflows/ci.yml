name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -w @ryanjensen/web
      - run: npm run typecheck -w @ryanjensen/web
      - run: npm run build -w @ryanjensen/web
      - name: Accessibility and layout checks
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          npx next start -p 3000 &
          npx -y wait-on http://localhost:3000
          npm run test:a11y -- http://localhost:3000

  fit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @ryanjensen/fit-check
      - run: npm test -w @ryanjensen/fit-check
      - name: Bundle the Worker
        working-directory: apps/fit-check
        run: npx wrangler deploy --dry-run --outdir=dist

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -w @ryanjensen/admin
      - run: npm run typecheck -w @ryanjensen/admin
      - run: npm test -w @ryanjensen/admin
      - run: npm run build -w @ryanjensen/admin
      - name: Accessibility and layout checks (local D1 with fake data, test-only sign-in skip)
        working-directory: apps/admin
        run: |
          npx playwright install --with-deps chromium
          npm run migrate:local
          npm run seed:local
          ADMIN_AUTH_BYPASS=1 npm run dev &
          npx -y wait-on http://localhost:3101/auth/login
          npm run test:a11y

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # Deploys both Workers after every check passes on main. Order matters: the schema first, then fit-check,
  # then admin (its "Add posting" calls fit-check's Admin entrypoint). Worker secrets stay in Cloudflare.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, fit-check, admin, infra]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-workers
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations (wrangler answers its own prompt with yes in CI)
        run: npm run migrate:remote -w @ryanjensen/fit-check
      - name: Deploy fit-check
        run: npm run deploy -w @ryanjensen/fit-check
      - name: Deploy admin
        run: npm run deploy -w @ryanjensen/admin
