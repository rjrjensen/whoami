# Each version picks a headline and summary, and can pull tagged highlights to the top of each job.
# Items marked `variants: [...]` in resume.yaml only appear in the versions they list.
# `summary` goes on the resumes; `intro` is the website's more personal version, in Ryan's own voice.

base:
  file: Ryan Jensen - Resume
  label: Complete
  headline: Software Engineer & Technology Leader
  summary: >-
    I use software to innovate, automate, and improve development and user experiences. My skills lie heavily in
    scalable, full-stack web and native applications.
  intro: >-
    I'm a software engineer in West Des Moines, Iowa, with a career spent building, breaking, fixing, and shipping
    software across a wild range of tech stacks. These days I wear two hats: Software Consultant at Source Allies,
    and the entire IT department at Patient Preferred.

