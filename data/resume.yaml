work:
  - name: Source Allies
    position: Software Consultant
    location: Urbandale, IA
    startDate: 2024-12
    summary: >-
      Delivered software consulting across 4+ client engagements spanning financial services, insurance,
      identity management, and enterprise web platforms. Work covered full-stack development, technical
      delivery leadership, coaching, and generative AI.
    highlights:
      - text: >-
          Led internationalization of a client's customer-facing portal and outgoing email system, adding full
          English/French support using Vue I18n and Thymeleaf on a Vue.js frontend and Java/Spring Boot backend,
          covering both web pages and email layouts.
        tags: [delivery]
      - text: Reworked the frontend of a high-traffic identity-management application, one of the client's most performant systems.
        tags: [frontend]
        variants: [base, lead]
      - text: Bootstrapped a generative AI initiative using AWS Bedrock, Python, and Node.js.
        tags: [ai, initiative]
      - text: >-
          Served as technical delivery lead on a data engineering engagement using SQL Server, Databricks, and dbt,
          with project management and coaching responsibilities.
        tags: [leadership, delivery]
      - text: Contributed across engagements as needed in delivery, strategy development, product management, UX/UI, and business analysis.
        variants: [base, lead]
      - text: >-
          Ranked #1 interviewer at Source Allies for 2025 and the first half of 2026. Interviewed 30+ candidates;
          about 10 were hired and are still with the company.
        tags: [leadership, hiring]
      - text: Mentored and taught the company's apprentices.
        tags: [leadership, mentoring]
    technologies: [Vue.js, React, Java, Spring Boot, GraphQL, "C#", TypeScript, Python, Node.js, AWS, AWS Bedrock, Azure, SQL Server, Databricks, dbt]

  - name: Patient Preferred Financial Services
    url: https://patientpreferredservices.com
    position: Fractional CTO
    location: Remote
    startDate: 2021-11
    note: Currently part-time, supporting new feature requests and regular software updates.
    summary: >-
      The company's sole developer and IT person for its clinic payment and patient management platform, inherited
      from a larger development team. Report directly to leadership and own technology strategy and roadmap, budget
      and vendor selection, and security and compliance. Partner closely with teams at the company's software
      vendors, including DataX, ACHeck, and Web.com.
    highlights:
      - text: >-
          Cut monthly AWS costs ~91%, from ~$1,400 to ~$120, over three years of incremental modernization with
          Terraform, CloudFront path-based routing, and right-sized infrastructure, while improving availability,
          stability, and speed.
        tags: [architecture, cost]
      - text: >-
          Modernized the platform from an AngularJS frontend and .NET Framework 4.5 API on Windows Server 2012 EC2
          instances to React on AWS Amplify and a .NET 10 Minimal API on Elastic Beanstalk, with SQL Server moved to
          RDS and SQL Agent jobs replaced by EventBridge-triggered Lambda functions.
        tags: [architecture]
      - text: Integrated third-party software offerings with resiliency and fallback plans for critical processes, including ACH payment processing.
        tags: [architecture, vendors]
      - text: Handle everything from patient onboarding and document signing to customer support and keeping the lights on.
        variants: [base, lead]
    technologies: [".NET Framework 4.5 → .NET 10", AngularJS → React, AWS Amplify, Elastic Beanstalk, RDS for SQL Server, EventBridge + Lambda, CloudFront, Terraform]

  - name: Principal Financial Group
    position: Contract Senior Software Engineer
    location: Des Moines, IA (Remote)
    startDate: 2024-06
    endDate: 2024-12
    summary: >-
      Upgraded legacy .NET applications and set up CI/CD pipelines using GitHub Actions. Supported the team on
      migrations from on-prem to AWS, including Lambda for serverless applications and SNS for pub/sub messaging.
      Reduced build times in existing pipelines by at least 80% to improve developer experience and tighten
      feedback loops.

  - name: Wellabe, Inc.
    position: Software Engineer 3
    location: Des Moines, IA
    startDate: 2022-07
    endDate: 2024-06
    summary: >-
      Led several small teams rewriting parts or all of applications to unify the company tech stack, adopt modern
      frameworks and tooling, and optimize the performance of legacy software. Migrated older WPF desktop apps to
      Blazor web apps. Supported and improved daily business-critical batch programs. Reengineered CI/CD processes
      to increase developer throughput and added requirements to encourage test coverage. Built a department wiki
      to centralize company, department, and team documentation. Served as senior engineering mentor to 7 junior
      and mid-level engineers.
    highlights:
      - text: Led the team that owned the company's main revenue-generating software product, delivering features on request.
        tags: [leadership]
      - text: >-
          Responsible for every engineer on the team: trained them, answered their questions, and paired with each
          intern for their entire internship.
        tags: [leadership, mentoring]

  - name: Far Reach Inc.
    position: Contract Senior Software Developer
    note: Contract via Modis
    startDate: 2022-03
    endDate: 2022-06
    summary: >-
      Consulted on a homegrown ERP system. Implemented full-stack features and changes using Angular, RxJS, .NET,
      and SQL Server on a hosted Azure instance. Accelerated development using ASP.NET Boilerplate, PrimeNG, and
      Bootstrap.

  - name: Hy-Vee, Inc.
    position: Software Engineer
    startDate: 2019-10
    endDate: 2022-03
    summary: >-
      Led an effort to migrate widely used code libraries from a file share to a GitHub repository with a full
      CI/CD pipeline, cloud artifact storage, and automated test suites. Leveraged existing CI/CD technologies to
      cut pipeline build times by at least 50%. Legacy applications were primarily .NET (mixed C# and VB) with
      WinForms frontends. Greenfield applications were built with React and RxJS on a backend of Kotlin, Spring
      Boot, Ktor, and GraphQL, federated into a supergraph with Apollo Federation and hosted on Google Cloud.
    highlights:
      - text: >-
          Served on a task force that built a Tax API to manage tax values for retail products at every Hy-Vee
          location (roughly 280 grocery stores and 175 convenience stores at the time).
        tags: [architecture]
      - text: >-
          Solved the problem of loading millions of tax records onto the servers of newly built stores: data went
          out in batches, with a check after each batch to confirm every item was accounted for.
        tags: [architecture]
      - text: Used a pub/sub architecture to release new tax values to all stores.
        tags: [architecture]

  - name: Stine Seed, Inc.
    position: Software Developer
    location: Dallas Center, IA
    startDate: 2019-05
    endDate: 2019-10
    summary: >-
      Developed features for employee-facing portals used to manage seed production, packaging, and sales.
      Maintained a tight feedback loop with users as implementations were deployed and tested. Used Angular for
      the frontend and .NET Core for the backend, with CI/CD handled through custom Azure DevOps processes I built.

  - name: Brownells, Inc.
    position: Associate .NET Developer
    location: Grinnell, IA
    startDate: 2018-01
    endDate: 2019-04
    summary: >-
      Integrated a new third-party ERP offering with existing WMS and POS systems. Constructed message pathways and
      failover processes in a pub/sub architecture between all systems. The frontend was built with Razor Pages,
      jQuery, AJAX, and Bootstrap; the backend used .NET Framework ASP.NET APIs, with a message bus built on IBM MQ.

  - name: UPS
    position: Package Handler → Local Sort Supervisor → Package Center Supervisor
    location: Ames, IA
    startDate: 2013-03
    endDate: 2017-12
    variants: [base, manager]
    summary: >-
      Promoted twice, from package handler to Package Center Supervisor. Supervised 30+ drivers and 40+ inside
      employees, holding workgroups accountable for safety, production, and attendance. Personally trained more
      than half of them and kept their certifications current.
    roles:
      - position: Package Center Supervisor
        startDate: 2015-03
        endDate: 2017-12
        highlights:
          - >-
            Oversaw all delivery drivers during the day, supporting their needs, keeping every route running
            smoothly, and handling emergencies.
          - Tracked operational data including fuel usage, time card accuracy, and a continually updated map of the delivery region.
      - position: Local Sort Supervisor
        startDate: 2014-03
        endDate: 2015-03
        highlights:
          - >-
            Ran the evening local sort, ensuring packages from 30+ package cars were unloaded and sorted into five
            outbound trailers, with small packages separated and bagged.
          - Handled training, terminations, and other personnel management for the sort crew.
      - position: Package Handler
        startDate: 2013-03
        endDate: 2014-03
        highlights:
          - Loaded and unloaded trucks.
          - Moved into international package processing, verifying packages met requirements to ship internationally by air or freight.
          - Trained in hazardous materials handling, classification, and proper shipping.

