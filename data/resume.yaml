# Single source of truth for every resume version and download format.
# Structure follows the JSON Resume schema (https://jsonresume.org/schema) with a few extensions:
#   variants: [base, manager, lead]  -> limit an item to those versions (omit = all versions)
#   tags: [...]                      -> lets a version pull matching highlights to the top
#   summary / highlight text: { default: ..., manager: ... } -> per-version wording

