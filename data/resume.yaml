work:
  - name: Source Allies
    position: Software Consultant
    location: Urbandale, IA
    startDate: 2024-12
    summary: >-
      Consultant across 4+ client engagements in financial services, insurance, identity management, and enterprise
      web, spanning full-stack development, delivery leadership, coaching, and generative AI.
    highlights:
      - text: "Ranked #1 interviewer for 2025 and the first half of 2026, with 30+ interviews and ~10 hires still with the company."
        tags: [leadership, hiring]
      - text: Technical delivery lead for a regional mutual insurer's data engineering engagement (SQL Server, T-SQL, Databricks, dbt), including project management and coaching.
        tags: [leadership, delivery]
      - text: Led English/French internationalization of a roofing-materials manufacturer's customer portal and outgoing email for the US and Canada (Vue I18n, Thymeleaf, Spring Boot).
        tags: [delivery]
      - text: Bootstrapped a generative AI initiative on AWS Bedrock.
        tags: [ai, initiative]
      - text: >-
          Redesigning a federally backed bank's high-traffic web application, which handles all of its money intake:
          reworked the frontend, built its first public API and secured it, and moved identity to PingOne, migrating
          Active Directory and LDAP users.
        tags: [frontend, architecture, security]
      - text: Helped design a digital-identity company's webinar platform in Figma.
        tags: [design]
      - text: Mentor and teach the company's apprentices.
        tags: [leadership, mentoring]
    technologies: [Vue.js, React, Java, Spring Boot, GraphQL, "C#", TypeScript, Python, Node.js, AWS Bedrock, Azure, SQL Server, T-SQL, Databricks, dbt, PingOne, Active Directory / LDAP, Figma]

  - name: Patient Preferred Financial Services
    url: https://patientpreferredservices.com
    position: Fractional CTO
    location: Remote
    startDate: 2021-11
    note: Currently part-time, supporting new feature requests and regular software updates.
    summary: >-
      Took over a clinic payment and patient-management platform from a larger development team and run it solo,
      reporting to leadership. Own technology strategy, budget, vendor relationships (DataX, ACHeck, Web.com), and
      security and compliance.
    highlights:
      - text: Cut monthly AWS costs ~91% (~$1,400 → ~$120) over three years while improving availability, stability, and speed.
        tags: [architecture, cost]
      - text: >-
          Modernized the platform from an AngularJS frontend, .NET Framework API, and SQL Server with SQL Jobs on Windows Server 2012 EC2 instances to SSR Next.js on AWS via OpenNext, modern .NET Minimal APIs on AWS Lambda, PostgreSQL on AWS RDS, and crontab on a nano Linux instance.
        tags: [architecture]
      - text: Built resiliency and fallback plans into critical third-party integrations, including ACH payments.
        tags: [architecture, vendors]
    technologies: [".NET Framework 4.5 → .NET 10", AngularJS → Next.js, SQL Server → PostgreSQL, EC2 → CloudFront + Lambda + OpenNext, SQL Jobs → Linux (crontab), Terraform]

  - name: Principal Financial Group
    position: Contract Senior Software Engineer
    location: Des Moines, IA (Remote)
    startDate: 2024-06
    endDate: 2024-12
    summary: Modernized legacy .NET applications and the pipelines that ship them.
    highlights:
      - text: Cut build times in existing pipelines by 80%+, tightening developer feedback loops.
        tags: [delivery]
      - text: Set up CI/CD in GitHub Actions and supported on-prem-to-AWS migrations using Lambda and SNS.
        tags: [architecture]

  - name: Wellabe, Inc.
    position: Software Engineer 3
    location: Des Moines, IA
    startDate: 2022-07
    endDate: 2024-06
    summary: Led small teams modernizing the company's software and unifying its tech stack.
    highlights:
      - text: Led the team that owned the company's main revenue-generating product, training and supporting every engineer on it.
        tags: [leadership]
      - text: Mentored 7 junior and mid-level engineers and paired with each intern for their entire internship.
        tags: [leadership, mentoring]
      - text: Migrated WPF desktop apps to Blazor web apps and improved the performance of legacy software.
        tags: [architecture]
      - text: Reengineered CI/CD to increase developer throughput and added test-coverage requirements.
        tags: [delivery]
      - text: Improved business-critical daily batch programs and built a department wiki to centralize documentation.

  - name: Far Reach Inc.
    position: Contract Senior Software Developer
    note: Contract via Modis
    startDate: 2022-03
    endDate: 2022-06
    summary: >-
      Built full-stack features for a homegrown ERP system with Angular, RxJS, .NET, and SQL Server on Azure, using
      ASP.NET Boilerplate, PrimeNG, and Bootstrap, and upgraded the company's internal .NET applications.

  - name: Hy-Vee, Inc.
    position: Software Engineer
    startDate: 2019-10
    endDate: 2022-03
    summary: >-
      Worked across legacy .NET and WinForms applications and greenfield React, Kotlin, Spring Boot, Ktor, and GraphQL
      services, federated with Apollo on Google Cloud.
    highlights:
      - text: >-
          Helped build a Tax API on a task force, managing product tax values for 450+ grocery and convenience stores
          and publishing updates to every store over pub/sub.
        tags: [architecture]
      - text: Seeded new stores with millions of tax records in batches, with a check after each batch that every item was accounted for.
        tags: [architecture]
      - text: Led the move of widely used shared libraries from a file share to GitHub, with CI/CD, artifact storage, and automated tests.
        tags: [delivery, leadership]
      - text: Cut CI/CD build times by 50%+.
        tags: [delivery]

  - name: Stine Seed, Inc.
    position: Software Developer
    location: Dallas Center, IA
    startDate: 2019-04
    endDate: 2019-10
    summary: >-
      Built features for employee portals that manage seed production, packaging, and sales (Angular, .NET Core),
      set up CI/CD in Azure DevOps, and kept a tight feedback loop with users.

  - name: Brownells, Inc.
    position: Associate .NET Developer
    location: Grinnell, IA
    startDate: 2017-12
    endDate: 2019-04
    summary: >-
      Integrated a new third-party ERP with existing WMS and POS systems, building pub/sub message pathways and
      failover on IBM MQ, with a Razor Pages, jQuery, and Bootstrap frontend on .NET Framework APIs.

  - name: UPS
    position: Package Handler → Local Sort Supervisor → Package Center Supervisor
    location: Ames, IA
    startDate: 2013-03
    endDate: 2017-12
    variants: [base, manager]
    summary: >-
      Promoted twice in two years. Supervised 30+ drivers and 40+ inside employees on safety, production, and
      attendance, and personally trained more than half of them.
    roles:
      - position: Package Center Supervisor
        startDate: 2015-03
        endDate: 2017-12
        highlights:
          - >-
            Ran daytime delivery operations for every driver: kept routes on track, handled emergencies, and tracked
            fuel use, time-card accuracy, and the delivery-area map.
      - position: Local Sort Supervisor
        startDate: 2014-03
        endDate: 2015-03
        highlights:
          - >-
            Ran the evening sort of 30+ package cars into five outbound trailers, and handled training, certifications,
            terminations, and personnel management.
      - position: Package Handler
        startDate: 2013-03
        endDate: 2014-03
        highlights:
          - >-
            Loaded and unloaded trucks, then processed international shipments for air and freight; trained in
            hazardous-materials handling and classification.

